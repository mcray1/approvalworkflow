; PlatformIO project configuration
; ESP32 High-Speed Line Follower
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; NOTE: This project targets the Arduino-ESP32 *3.x* core (LEDC v3 API:
; ledcAttach/ledcWrite). The platform version below is pinned to a release that
; ships that core. Adjust if your toolchain differs; see README.md.

[env:esp32dev]
platform      = espressif32@^6.5.0     ; ships Arduino-ESP32 3.x core
board         = esp32dev
framework     = arduino

; Serial
monitor_speed = 115200
upload_speed  = 921600                  ; lower to 115200 if uploads fail

; Libraries
lib_deps =
    pololu/QTRSensors @ ^4.0.0

; Optional: faster CPU / build flags
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; -D COMPETITION_MODE_ON               ; uncomment to silence telemetry

; If PlatformIO's library manager name differs, you can instead point at the
; GitHub source:
;   lib_deps = https://github.com/pololu/qtr-sensors-arduino.git
