<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg   { fill:#ffffff; }
    .blk  { fill:#f4f7fb; stroke:#33415c; stroke-width:2; }
    .blkh { fill:#e8eefc; stroke:#33415c; stroke-width:2; }
    .title{ fill:#13203a; font-size:25px; font-weight:700; }
    .sub  { fill:#4a5676; font-size:13px; }
    .bt   { fill:#13203a; font-size:16px; font-weight:700; }
    .pin  { fill:#13203a; font-size:11.5px; }
    .pinm { fill:#13203a; font-size:11.5px; font-weight:600; }
    .note { fill:#1f2a44; font-size:12.5px; }
    .noteb{ fill:#1f2a44; font-size:12.5px; font-weight:700; }
    .sig  { stroke:#1f6feb; stroke-width:2.4; fill:none; }
    .mot  { stroke:#8a2be2; stroke-width:2.4; fill:none; }
    .out  { stroke:#2e8b57; stroke-width:3;   fill:none; }
    .p3v3 { stroke:#e23b2e; stroke-width:2.6; fill:none; }
    .pvm  { stroke:#f08c00; stroke-width:3;   fill:none; }
    .gnd  { stroke:#222831; stroke-width:3;   fill:none; }
    circle.j { fill:#13203a; }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="940"/>
  <text class="title" x="30" y="42">ESP32 Line-Follower — Complete Wiring Diagram</text>
  <text class="sub"   x="30" y="64">QTR-8RC (8 sensors) · TB6612FNG driver · 2× DC motors · GPIO34 start/stop button.  Pins match config.h.  ● = connected junction; crossing lines without a dot are NOT connected.</text>

  <!-- ===================== QTR-8RC ===================== -->
  <rect class="blk" x="50" y="90" width="200" height="360" rx="8"/>
  <rect class="blkh" x="50" y="90" width="200" height="30" rx="8"/>
  <text class="bt" x="150" y="111" text-anchor="middle">QTR-8RC array</text>

  <!-- sensor output pins (right edge) -->
  <g>
    <!-- y: 150,185,220,255,290,325,360,395 -->
    <circle class="j" cx="250" cy="150" r="4"/><text class="pin" x="244" y="154" text-anchor="end">OUT1</text>
    <circle class="j" cx="250" cy="185" r="4"/><text class="pin" x="244" y="189" text-anchor="end">OUT2</text>
    <circle class="j" cx="250" cy="220" r="4"/><text class="pin" x="244" y="224" text-anchor="end">OUT3</text>
    <circle class="j" cx="250" cy="255" r="4"/><text class="pin" x="244" y="259" text-anchor="end">OUT4</text>
    <circle class="j" cx="250" cy="290" r="4"/><text class="pin" x="244" y="294" text-anchor="end">OUT5</text>
    <circle class="j" cx="250" cy="325" r="4"/><text class="pin" x="244" y="329" text-anchor="end">OUT6</text>
    <circle class="j" cx="250" cy="360" r="4"/><text class="pin" x="244" y="364" text-anchor="end">OUT7</text>
    <circle class="j" cx="250" cy="395" r="4"/><text class="pin" x="244" y="399" text-anchor="end">OUT8</text>
  </g>
  <!-- QTR power stubs (left edge) -->
  <line class="p3v3" x1="50" y1="140" x2="20" y2="140"/><text class="pin" x="24" y="135">VCC → 3V3</text>
  <line class="p3v3" x1="50" y1="170" x2="20" y2="170"/><text class="pin" x="24" y="165">LEDON → 3V3 (tie HIGH)</text>
  <line class="gnd"  x1="50" y1="420" x2="20" y2="420"/><text class="pin" x="24" y="414">GND → common</text>
  <text class="sub" x="60" y="440">Emitters always on (no MCU control)</text>

  <!-- ===================== ESP32 ===================== -->
  <rect class="blk" x="470" y="90" width="250" height="430" rx="8"/>
  <rect class="blkh" x="470" y="90" width="250" height="30" rx="8"/>
  <text class="bt" x="595" y="111" text-anchor="middle">ESP32 DevKit</text>

  <!-- left edge: sensor GPIOs (align to QTR OUT y) -->
  <g>
    <circle class="j" cx="470" cy="150" r="4"/><text class="pinm" x="478" y="154">GPIO16</text>
    <circle class="j" cx="470" cy="185" r="4"/><text class="pinm" x="478" y="189">GPIO17</text>
    <circle class="j" cx="470" cy="220" r="4"/><text class="pinm" x="478" y="224">GPIO18</text>
    <circle class="j" cx="470" cy="255" r="4"/><text class="pinm" x="478" y="259">GPIO19</text>
    <circle class="j" cx="470" cy="290" r="4"/><text class="pinm" x="478" y="294">GPIO21</text>
    <circle class="j" cx="470" cy="325" r="4"/><text class="pinm" x="478" y="329">GPIO22</text>
    <circle class="j" cx="470" cy="360" r="4"/><text class="pinm" x="478" y="364">GPIO23</text>
    <circle class="j" cx="470" cy="395" r="4"/><text class="pinm" x="478" y="399">GPIO4</text>
  </g>
  <!-- right edge: motor + button -->
  <g>
    <circle class="j" cx="720" cy="150" r="4"/><text class="pinm" x="712" y="154" text-anchor="end">GPIO25 PWMA</text>
    <circle class="j" cx="720" cy="185" r="4"/><text class="pinm" x="712" y="189" text-anchor="end">GPIO26 AIN1</text>
    <circle class="j" cx="720" cy="220" r="4"/><text class="pinm" x="712" y="224" text-anchor="end">GPIO27 AIN2</text>
    <circle class="j" cx="720" cy="265" r="4"/><text class="pinm" x="712" y="269" text-anchor="end">GPIO14 PWMB</text>
    <circle class="j" cx="720" cy="300" r="4"/><text class="pinm" x="712" y="304" text-anchor="end">GPIO12 BIN1 ⚠</text>
    <circle class="j" cx="720" cy="335" r="4"/><text class="pinm" x="712" y="339" text-anchor="end">GPIO13 BIN2</text>
    <circle class="j" cx="720" cy="430" r="4"/><text class="pinm" x="712" y="434" text-anchor="end">GPIO34 BTN</text>
  </g>
  <!-- power stubs (top) -->
  <line class="p3v3" x1="520" y1="90" x2="520" y2="60"/><text class="pin" x="524" y="78">3V3 out</text>
  <line class="gnd"  x1="600" y1="90" x2="600" y2="60"/><text class="pin" x="604" y="78">GND</text>
  <line class="pvm"  x1="665" y1="90" x2="665" y2="60"/><text class="pin" x="669" y="78">VIN (5V)</text>

  <!-- ===================== TB6612FNG ===================== -->
  <rect class="blk" x="880" y="90" width="240" height="360" rx="8"/>
  <rect class="blkh" x="880" y="90" width="240" height="30" rx="8"/>
  <text class="bt" x="1000" y="111" text-anchor="middle">TB6612FNG driver</text>

  <!-- left edge control pins -->
  <g>
    <circle class="j" cx="880" cy="150" r="4"/><text class="pinm" x="888" y="154">PWMA</text>
    <circle class="j" cx="880" cy="185" r="4"/><text class="pinm" x="888" y="189">AIN1</text>
    <circle class="j" cx="880" cy="220" r="4"/><text class="pinm" x="888" y="224">AIN2</text>
    <circle class="j" cx="880" cy="265" r="4"/><text class="pinm" x="888" y="269">PWMB</text>
    <circle class="j" cx="880" cy="300" r="4"/><text class="pinm" x="888" y="304">BIN1</text>
    <circle class="j" cx="880" cy="335" r="4"/><text class="pinm" x="888" y="339">BIN2</text>
  </g>
  <!-- right edge motor outputs -->
  <g>
    <circle class="j" cx="1120" cy="160" r="4"/><text class="pinm" x="1112" y="164" text-anchor="end">AO1</text>
    <circle class="j" cx="1120" cy="200" r="4"/><text class="pinm" x="1112" y="204" text-anchor="end">AO2</text>
    <circle class="j" cx="1120" cy="300" r="4"/><text class="pinm" x="1112" y="304" text-anchor="end">BO1</text>
    <circle class="j" cx="1120" cy="340" r="4"/><text class="pinm" x="1112" y="344" text-anchor="end">BO2</text>
  </g>
  <!-- power stubs -->
  <line class="pvm"  x1="935"  y1="90" x2="935"  y2="60"/><text class="pin" x="939" y="78">VM → Batt+</text>
  <line class="p3v3" x1="1010" y1="90" x2="1010" y2="60"/><text class="pin" x="1014" y="78">VCC → 3V3</text>
  <line class="p3v3" x1="1075" y1="90" x2="1075" y2="60"/><text class="pin" x="1079" y="78">STBY → 3V3</text>
  <line class="gnd"  x1="905"  y1="450" x2="905" y2="480"/><text class="pin" x="909" y="472">GND → common</text>

  <!-- ===================== Motors ===================== -->
  <circle class="blk" cx="1215" cy="180" r="30"/><text class="bt" x="1215" y="185" text-anchor="middle">M-L</text>
  <text class="sub" x="1215" y="228" text-anchor="middle">Left motor</text>
  <circle class="blk" cx="1215" cy="320" r="30"/><text class="bt" x="1215" y="325" text-anchor="middle">M-R</text>
  <text class="sub" x="1215" y="368" text-anchor="middle">Right motor</text>

  <!-- ===================== SIGNAL WIRES ===================== -->
  <!-- sensors: QTR OUT -> ESP32 GPIO (straight rows) -->
  <g class="sig">
    <line x1="250" y1="150" x2="470" y2="150"/>
    <line x1="250" y1="185" x2="470" y2="185"/>
    <line x1="250" y1="220" x2="470" y2="220"/>
    <line x1="250" y1="255" x2="470" y2="255"/>
    <line x1="250" y1="290" x2="470" y2="290"/>
    <line x1="250" y1="325" x2="470" y2="325"/>
    <line x1="250" y1="360" x2="470" y2="360"/>
    <line x1="250" y1="395" x2="470" y2="395"/>
  </g>
  <text class="sub" x="360" y="143" text-anchor="middle" fill="#1f6feb">8 sensor signals</text>

  <!-- motor control: ESP32 -> TB6612 (straight rows) -->
  <g class="mot">
    <line x1="720" y1="150" x2="880" y2="150"/>
    <line x1="720" y1="185" x2="880" y2="185"/>
    <line x1="720" y1="220" x2="880" y2="220"/>
    <line x1="720" y1="265" x2="880" y2="265"/>
    <line x1="720" y1="300" x2="880" y2="300"/>
    <line x1="720" y1="335" x2="880" y2="335"/>
  </g>
  <text class="sub" x="800" y="143" text-anchor="middle" fill="#8a2be2">6 control signals</text>

  <!-- motor outputs: TB6612 -> motors -->
  <g class="out">
    <path d="M1120,160 H1175 V165 H1185"/>
    <path d="M1120,200 H1160 V196 H1185"/>
    <path d="M1120,300 H1175 V305 H1185"/>
    <path d="M1120,340 H1160 V336 H1185"/>
  </g>

  <!-- button: GPIO34 routed to Button inset -->
  <g class="sig">
    <path d="M720,430 H760 V600"/>
  </g>
  <circle class="j" cx="760" cy="600" r="4"/>

  <!-- ===================== BUTTON INSET ===================== -->
  <rect class="blk" x="470" y="600" width="300" height="190" rx="8"/>
  <rect class="blkh" x="470" y="600" width="300" height="28" rx="8"/>
  <text class="bt" x="620" y="620" text-anchor="middle">Start / Stop button (GPIO34)</text>
  <!-- 3V3 top -->
  <line class="p3v3" x1="620" y1="640" x2="620" y2="665"/>
  <text class="pin" x="626" y="652">3V3</text>
  <!-- resistor 10k (zigzag) -->
  <polyline class="sig" points="620,665 610,671 630,679 610,687 630,695 620,701" stroke="#13203a"/>
  <text class="pin" x="636" y="686">10 kΩ</text>
  <!-- node -->
  <circle class="j" cx="620" cy="715" r="4"/>
  <line class="gnd"  x1="620" y1="715" x2="620" y2="760"/>
  <!-- button symbol on the branch to GND -->
  <line x1="605" y1="730" x2="635" y2="730" stroke="#13203a" stroke-width="2"/>
  <line x1="610" y1="738" x2="642" y2="726" stroke="#13203a" stroke-width="2"/>
  <circle cx="605" cy="730" r="2.5" fill="#13203a"/><circle cx="635" cy="730" r="2.5" fill="#13203a"/>
  <text class="pin" x="650" y="733">push (N.O.)</text>
  <text class="pin" x="300" y="760" text-anchor="start" fill="#13203a">GND</text>
  <line class="gnd" x1="620" y1="760" x2="330" y2="760"/>
  <!-- node to GPIO34 -->
  <line class="sig" x1="620" y1="715" x2="760" y2="715"/>
  <path class="sig" d="M760,600 V715"/>
  <text class="pin" x="690" y="710" fill="#1f6feb">→ GPIO34</text>
  <text class="sub" x="486" y="784">Idle = HIGH (pulled up); pressed = LOW. GPIO34 is input-only → external pull-up required.</text>

  <!-- ===================== POWER INSET ===================== -->
  <rect class="blk" x="50" y="560" width="380" height="330" rx="8"/>
  <rect class="blkh" x="50" y="560" width="380" height="28" rx="8"/>
  <text class="bt" x="240" y="580" text-anchor="middle">Power distribution</text>

  <!-- battery -->
  <rect x="80" y="610" width="120" height="70" rx="6" fill="#fff" stroke="#33415c" stroke-width="2"/>
  <text class="pinm" x="140" y="642" text-anchor="middle">Battery pack</text>
  <text class="sub"  x="140" y="662" text-anchor="middle">(confirm V / chem.)</text>
  <text class="pinm" x="206" y="622">+</text>
  <text class="pinm" x="206" y="678">−</text>

  <!-- regulator -->
  <rect x="80" y="730" width="120" height="56" rx="6" fill="#fff" stroke="#33415c" stroke-width="2"/>
  <text class="pinm" x="140" y="752" text-anchor="middle">Regulator</text>
  <text class="sub"  x="140" y="770" text-anchor="middle">→ 3.3 V logic</text>

  <!-- VM rail (orange): Batt+ -> VM -->
  <path class="pvm" d="M200,615 H360 V600"/>
  <circle class="j" cx="200" cy="615" r="4"/>
  <text class="pin" x="300" y="610" fill="#f08c00">VM (motor supply)</text>

  <!-- Batt+ -> regulator -->
  <path class="pvm" d="M200,650 H230 V730"/>
  <circle class="j" cx="230" cy="730" r="4"/>
  <!-- regulator -> 3V3 node -->
  <path class="p3v3" d="M200,758 H300 V600"/>
  <text class="pin" x="306" y="648" fill="#e23b2e">3V3 → ESP32, QTR(VCC+LEDON),</text>
  <text class="pin" x="306" y="664" fill="#e23b2e">TB6612(VCC+STBY), button pull-up</text>

  <!-- GND bar -->
  <line class="gnd" x1="80" y1="860" x2="400" y2="860"/>
  <path class="gnd" d="M140,680 V860"/>
  <circle class="j" cx="140" cy="680" r="4"/>
  <circle class="j" cx="140" cy="860" r="5"/>
  <text class="noteb" x="150" y="852">COMMON GND</text>
  <text class="sub" x="150" y="878">ESP32 · QTR · TB6612 · battery − all tie here</text>

  <text class="sub" x="70" y="606" fill="#f08c00">Keep VM &amp; logic supplies separate; add bulk 470µF + 0.1µF across VM–GND at the driver.</text>

  <!-- ===================== LEGEND / NOTES ===================== -->
  <rect class="blk" x="800" y="520" width="450" height="370" rx="8"/>
  <rect class="blkh" x="800" y="520" width="450" height="28" rx="8"/>
  <text class="bt" x="1025" y="540" text-anchor="middle">Legend &amp; notes</text>

  <g>
    <line class="sig"  x1="820" y1="568" x2="860" y2="568"/><text class="note" x="868" y="572">Sensor signal (QTR OUT → ESP32 GPIO)</text>
    <line class="mot"  x1="820" y1="590" x2="860" y2="590"/><text class="note" x="868" y="594">Motor control (ESP32 → TB6612)</text>
    <line class="out"  x1="820" y1="612" x2="860" y2="612"/><text class="note" x="868" y="616">Motor output (TB6612 → motor)</text>
    <line class="p3v3" x1="820" y1="634" x2="860" y2="634"/><text class="note" x="868" y="638">3.3 V power</text>
    <line class="pvm"  x1="820" y1="656" x2="860" y2="656"/><text class="note" x="868" y="660">VM / Battery + (motor supply)</text>
    <line class="gnd"  x1="820" y1="678" x2="860" y2="678"/><text class="note" x="868" y="682">Ground (common)</text>
    <circle class="j" cx="840" cy="700" r="4"/><text class="note" x="868" y="704">Connected junction</text>
  </g>

  <text class="noteb" x="820" y="732">Before power-up:</text>
  <text class="note"  x="820" y="752">1. Tie QTR LEDON and TB6612 STBY HIGH (to 3V3).</text>
  <text class="note"  x="820" y="770">2. Power QTR &amp; TB6612 VCC from 3.3 V (no 5 V on ESP32 pins).</text>
  <text class="note"  x="820" y="788">3. External 10 kΩ pull-up on GPIO34; momentary button to GND.</text>
  <text class="note"  x="820" y="806">4. ⚠ GPIO12 (BIN1) is a strapping pin — if boot fails, move to GPIO33.</text>
  <text class="note"  x="820" y="824">5. Verify motor direction (wheels up) &amp; steering sign in config.h.</text>
  <text class="note"  x="820" y="842">6. Provide a PHYSICAL emergency disconnect on the motor supply.</text>
  <text class="sub"   x="820" y="866">Pins are defined in config.h (single source of truth); full table in WIRING.md.</text>
</svg>
