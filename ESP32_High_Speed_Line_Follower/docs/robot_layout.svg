<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg    { fill:#fbfcfe; }
    .title { fill:#13203a; font-size:25px; font-weight:700; }
    .sub   { fill:#4a5676; font-size:13px; }
    .pl    { fill:#13203a; font-size:14px; }
    .plb   { fill:#13203a; font-size:15px; font-weight:700; }
    .cap   { fill:#13203a; font-size:12px; }
    .capw  { fill:#ffffff; font-size:12px; font-weight:600; }
    .dimt  { fill:#7a6a2a; font-size:12px; }
    .lead  { stroke:#8a93a0; stroke-width:1.2; fill:none; }
    .chassis { fill:#eef2f8; stroke:#5a6b86; stroke-width:2.5; }
    .pcb   { fill:#15314f; stroke:#0c2036; stroke-width:2; }
    .drv   { fill:#2a6e3f; stroke:#184727; stroke-width:2; }
    .buck  { fill:#7a4ea0; stroke:#4a2d64; stroke-width:2; }
    .batt  { fill:#24406e; stroke:#142847; stroke-width:2; }
    .tire  { fill:#2b3442; stroke:#141a22; stroke-width:2; }
    .hub   { fill:#c7ccd4; stroke:#8a93a0; stroke-width:1.5; }
    .motor { fill:#b9892f; stroke:#6e5115; stroke-width:2; }
    .badge { fill:#f08c00; stroke:#8a5200; stroke-width:1.5; }
    .bt    { fill:#ffffff; font-size:12px; font-weight:700; }
    .arrow { fill:#1f6feb; }
  </style>

  <rect class="bg" x="0" y="0" width="1300" height="1000"/>
  <text class="title" x="30" y="44">ESP32 Line-Follower — Robot Assembly</text>
  <text class="sub"   x="30" y="66">Representative layout (top view + side profile). Chassis size, wheel diameter and motor dimensions are unspecified — marked “confirm”. Components match the wiring diagrams.</text>

  <!-- =================================================================== -->
  <!--  TOP VIEW                                                            -->
  <!-- =================================================================== -->
  <text class="plb" x="90" y="110">TOP VIEW</text>

  <!-- travel direction -->
  <g>
    <path class="arrow" d="M470,92 L470,132 L458,132 L488,86 L518,132 L506,132 L506,92 Z" transform="translate(50,0)"/>
    <text class="sub" x="600" y="114" text-anchor="start">FORWARD</text>
  </g>

  <!-- centerline -->
  <line x1="520" y1="80" x2="520" y2="800" stroke="#b9c2d0" stroke-width="1.5" stroke-dasharray="7 7"/>

  <!-- chassis -->
  <rect class="chassis" x="330" y="180" width="380" height="600" rx="42"/>

  <!-- sensor array bar (front, protrudes ahead) -->
  <rect x="408" y="150" width="14" height="36" fill="#2b3442"/>
  <rect x="618" y="150" width="14" height="36" fill="#2b3442"/>
  <rect class="pcb" x="312" y="138" width="416" height="30" rx="6"/>
  <g fill="#e9eef5">
    <circle cx="350" cy="153" r="6"/><circle cx="394" cy="153" r="6"/><circle cx="438" cy="153" r="6"/><circle cx="482" cy="153" r="6"/>
    <circle cx="526" cy="153" r="6"/><circle cx="570" cy="153" r="6"/><circle cx="614" cy="153" r="6"/><circle cx="658" cy="153" r="6"/>
  </g>

  <!-- drive wheels + hubs -->
  <rect class="tire" x="300" y="402" width="34" height="132" rx="8"/>
  <circle class="hub" cx="317" cy="468" r="11"/>
  <rect class="tire" x="706" y="402" width="34" height="132" rx="8"/>
  <circle class="hub" cx="723" cy="468" r="11"/>

  <!-- gear motors (shaft to hubs) -->
  <rect class="motor" x="360" y="436" width="92" height="64" rx="7"/>
  <line x1="360" y1="468" x2="328" y2="468" stroke="#6e5115" stroke-width="5"/>
  <rect class="motor" x="588" y="436" width="92" height="64" rx="7"/>
  <line x1="680" y1="468" x2="712" y2="468" stroke="#6e5115" stroke-width="5"/>

  <!-- breadboard + ESP32 -->
  <rect x="398" y="250" width="244" height="112" rx="8" fill="#f6eecd" stroke="#cdbd8e" stroke-width="2"/>
  <rect class="pcb" x="478" y="262" width="84" height="88" rx="5"/>
  <text class="bt" x="520" y="312" text-anchor="middle">ESP32</text>

  <!-- TB6612 driver -->
  <rect class="drv" x="352" y="598" width="60" height="74" rx="6"/>
  <text class="bt" x="382" y="639" text-anchor="middle">TB</text>

  <!-- buck -->
  <rect class="buck" x="628" y="598" width="60" height="74" rx="6"/>
  <text class="bt" x="658" y="632" text-anchor="middle">5V</text>

  <!-- battery -->
  <rect class="batt" x="424" y="556" width="192" height="118" rx="8"/>
  <text class="bt" x="520" y="620" text-anchor="middle">3S 11.1 V</text>

  <!-- button + kill switch -->
  <circle cx="462" cy="716" r="15" fill="#2b3442" stroke="#141a22" stroke-width="2"/>
  <circle cx="462" cy="716" r="7" fill="#c7ccd4"/>
  <rect x="556" y="702" width="34" height="28" rx="4" fill="#b23b3b" stroke="#6e1f1f" stroke-width="2"/>

  <!-- caster / ball wheel (rear) -->
  <circle cx="520" cy="752" r="20" fill="#cfd6de" stroke="#8a93a0" stroke-width="2"/>
  <circle cx="520" cy="752" r="8" fill="#9aa3b0"/>

  <!-- dimensions -->
  <!-- track width -->
  <line x1="317" y1="392" x2="723" y2="392" stroke="#caa94a" stroke-width="1.3"/>
  <path d="M317,388 V396 M723,388 V396" stroke="#caa94a" stroke-width="1.3"/>
  <text class="dimt" x="520" y="384" text-anchor="middle">track width (confirm)</text>
  <!-- wheelbase -->
  <line x1="690" y1="468" x2="690" y2="752" stroke="#caa94a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text class="dimt" x="700" y="616" transform="rotate(90,700,616)" text-anchor="middle">wheelbase (confirm)</text>

  <!-- number badges on top view -->
  <g>
    <circle class="badge" cx="300" cy="153" r="13"/><text class="bt" x="300" y="157" text-anchor="middle">1</text>
    <circle class="badge" cx="300" cy="468" r="13"/><text class="bt" x="300" y="472" text-anchor="middle">2</text>
    <circle class="badge" cx="406" cy="468" r="13"/><text class="bt" x="406" y="472" text-anchor="middle">3</text>
    <circle class="badge" cx="520" cy="782" r="13"/><text class="bt" x="520" y="786" text-anchor="middle">4</text>
    <circle class="badge" cx="520" cy="268" r="13"/><text class="bt" x="520" y="272" text-anchor="middle">5</text>
    <circle class="badge" cx="382" cy="598" r="13"/><text class="bt" x="382" y="602" text-anchor="middle">6</text>
    <circle class="badge" cx="520" cy="556" r="13"/><text class="bt" x="520" y="560" text-anchor="middle">7</text>
    <circle class="badge" cx="658" cy="598" r="13"/><text class="bt" x="658" y="602" text-anchor="middle">8</text>
    <circle class="badge" cx="462" cy="690" r="13"/><text class="bt" x="462" y="694" text-anchor="middle">9</text>
    <circle class="badge" cx="573" cy="690" r="13"/><text class="bt" x="573" y="694" text-anchor="middle">10</text>
  </g>

  <!-- =================================================================== -->
  <!--  PARTS LIST                                                          -->
  <!-- =================================================================== -->
  <rect x="770" y="150" width="500" height="340" rx="10" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <rect x="770" y="150" width="500" height="30" rx="10" fill="#e8eefc" stroke="#33415c" stroke-width="2"/>
  <text class="plb" x="1020" y="171" text-anchor="middle">Parts &amp; placement</text>
  <g>
    <g><circle class="badge" cx="794" cy="206" r="12"/><text class="bt" x="794" y="210" text-anchor="middle">1</text><text class="pl" x="816" y="211">QTR-8RC sensor array — at the front edge, low over the track</text></g>
    <g><circle class="badge" cx="794" cy="236" r="12"/><text class="bt" x="794" y="240" text-anchor="middle">2</text><text class="pl" x="816" y="241">Drive wheels ×2 — on the mid axle, left &amp; right</text></g>
    <g><circle class="badge" cx="794" cy="266" r="12"/><text class="bt" x="794" y="270" text-anchor="middle">3</text><text class="pl" x="816" y="271">Gear motors ×2 — differential drive, one per wheel</text></g>
    <g><circle class="badge" cx="794" cy="296" r="12"/><text class="bt" x="794" y="300" text-anchor="middle">4</text><text class="pl" x="816" y="301">Caster / ball wheel — rear, free-rolling balance point</text></g>
    <g><circle class="badge" cx="794" cy="326" r="12"/><text class="bt" x="794" y="330" text-anchor="middle">5</text><text class="pl" x="816" y="331">ESP32 on breadboard — center deck</text></g>
    <g><circle class="badge" cx="794" cy="356" r="12"/><text class="bt" x="794" y="360" text-anchor="middle">6</text><text class="pl" x="816" y="361">TB6612FNG motor driver — near the motors</text></g>
    <g><circle class="badge" cx="794" cy="386" r="12"/><text class="bt" x="794" y="390" text-anchor="middle">7</text><text class="pl" x="816" y="391">3S LiPo 11.1 V — low &amp; central (keeps the CG low)</text></g>
    <g><circle class="badge" cx="794" cy="416" r="12"/><text class="bt" x="794" y="420" text-anchor="middle">8</text><text class="pl" x="816" y="421">Buck 12 V→5 V (fixed) — feeds ESP32 5V/VIN</text></g>
    <g><circle class="badge" cx="794" cy="446" r="12"/><text class="bt" x="794" y="450" text-anchor="middle">9</text><text class="pl" x="816" y="451">Start/Stop button — reachable on the rear deck</text></g>
    <g><circle class="badge" cx="794" cy="476" r="12"/><text class="bt" x="794" y="480" text-anchor="middle">10</text><text class="pl" x="816" y="481">Power kill switch — hardware cutoff on the 12 V motor line</text></g>
  </g>

  <!-- =================================================================== -->
  <!--  SIDE PROFILE                                                        -->
  <!-- =================================================================== -->
  <rect x="770" y="520" width="500" height="430" rx="10" fill="#f9fafc" stroke="#33415c" stroke-width="2"/>
  <text class="plb" x="794" y="552">SIDE PROFILE</text>
  <text class="sub"  x="952" y="552">(front → left)</text>

  <!-- ground -->
  <line x1="800" y1="880" x2="1240" y2="880" stroke="#5a6b86" stroke-width="2.5"/>
  <g stroke="#9aa6b8" stroke-width="1.2">
    <line x1="808" y1="880" x2="800" y2="892"/><line x1="828" y1="880" x2="820" y2="892"/><line x1="848" y1="880" x2="840" y2="892"/>
    <line x1="868" y1="880" x2="860" y2="892"/><line x1="888" y1="880" x2="880" y2="892"/><line x1="908" y1="880" x2="900" y2="892"/>
    <line x1="1180" y1="880" x2="1172" y2="892"/><line x1="1200" y1="880" x2="1192" y2="892"/><line x1="1220" y1="880" x2="1212" y2="892"/>
  </g>
  <text class="cap" x="1150" y="900">track surface</text>

  <!-- rear drive wheel -->
  <circle class="tire" cx="1120" cy="822" r="58"/>
  <circle class="hub" cx="1120" cy="822" r="18"/>
  <!-- caster (front, small) -->
  <circle cx="892" cy="862" r="18" fill="#cfd6de" stroke="#8a93a0" stroke-width="2"/>

  <!-- chassis deck -->
  <rect class="chassis" x="868" y="744" width="320" height="22" rx="6"/>
  <line x1="1120" y1="766" x2="1120" y2="804" stroke="#5a6b86" stroke-width="3"/>  <!-- axle post -->

  <!-- motor over rear axle -->
  <rect class="motor" x="1070" y="700" width="92" height="44" rx="6"/>
  <text class="cap" x="1116" y="692" text-anchor="middle">motor</text>

  <!-- battery on deck -->
  <rect class="batt" x="950" y="690" width="110" height="54" rx="6"/>
  <text class="bt" x="1005" y="722" text-anchor="middle">11.1 V</text>

  <!-- esp32/breadboard on deck -->
  <rect x="902" y="706" width="44" height="38" rx="4" fill="#f6eecd" stroke="#cdbd8e" stroke-width="2"/>
  <rect class="pcb" x="910" y="712" width="28" height="26" rx="3"/>

  <!-- sensor array hanging at front, near ground -->
  <path d="M868,756 L838,756 L838,850" stroke="#2b3442" stroke-width="4" fill="none"/>
  <rect class="pcb" x="812" y="848" width="52" height="12" rx="3"/>
  <!-- ground-gap dimension -->
  <line x1="838" y1="860" x2="838" y2="880" stroke="#caa94a" stroke-width="1.3"/>
  <path d="M834,860 H842 M834,880 H842" stroke="#caa94a" stroke-width="1.3"/>
  <text class="dimt" x="760" y="868">sensor gap</text>
  <text class="dimt" x="760" y="884">≈ 3–8 mm</text>

  <!-- forward arrow -->
  <path class="arrow" d="M900,600 L860,600 L860,590 L832,612 L860,634 L860,624 L900,624 Z"/>
  <text class="sub" x="940" y="618">forward</text>

  <!-- side callouts -->
  <text class="cap" x="1000" y="676" text-anchor="middle">low, central battery → low centre of gravity</text>
  <text class="cap" x="812" y="836">QTR array</text>

  <text class="sub" x="30" y="966">Mechanical dimensions depend on your chassis/motors (unspecified).</text>
  <text class="sub" x="30" y="986">Keep the battery low &amp; centred, the sensor array square to the track at ≈3–8 mm, and the mass between the wheels for stable turns.</text>
</svg>
