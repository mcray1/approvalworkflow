<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 840" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#f4f7fb}
    .esp{fill:#dfe9fb;stroke:#1f6feb;stroke-width:2.5}
    .bt{font-size:20px;font-weight:800;fill:#13203a}
    .pin{font-size:14px;font-weight:700;fill:#13203a}
    .lab{font-size:14px;font-weight:700}
    .note{font-size:13.5px;fill:#1c2a44}
    .s{font-size:12px;fill:#5a6b86}
    .w{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .dot{fill:#13203a}
    .th{font-size:13.5px;font-weight:800;fill:#13203a}
  </style>
  <rect class="bg" x="0" y="0" width="1160" height="840"/>
  <rect x="0" y="0" width="1160" height="56" fill="#102a47"/>
  <rect x="0" y="52" width="1160" height="4" fill="#1f6feb"/>
  <text x="26" y="36" fill="#fff" font-size="22" font-weight="800">Start/Stop Button (D34) — circuit &amp; behavior</text>

  <!-- ESP32 -->
  <rect class="esp" x="70" y="150" width="200" height="280" rx="12"/>
  <text class="bt" x="170" y="300" text-anchor="middle">ESP32</text>
  <circle class="dot" cx="270" cy="200" r="5"/><text class="pin" x="262" y="205" text-anchor="end">3V3</text>
  <circle class="dot" cx="270" cy="280" r="5"/><text class="pin" x="262" y="285" text-anchor="end">D34</text>
  <circle class="dot" cx="270" cy="380" r="5"/><text class="pin" x="262" y="385" text-anchor="end">GND</text>

  <!-- 3V3 wire -->
  <path class="w" stroke="#e23b2e" d="M270,200 H560"/>
  <text class="s" x="400" y="190" fill="#e23b2e">3.3 V</text>
  <!-- 10k pull-up (vertical) -->
  <polyline class="w" stroke="#13203a" points="560,200 548,210 572,220 548,230 572,240 560,250"/>
  <text class="lab" x="582" y="230" fill="#13203a">10 kΩ</text>
  <text class="s" x="582" y="248" fill="#5a6b86">pull-up</text>
  <!-- node -->
  <circle class="dot" cx="560" cy="280" r="7"/>
  <path class="w" stroke="#13203a" stroke-width="4" d="M560,250 V280"/>
  <!-- node -> D34 -->
  <path class="w" stroke="#1f6feb" d="M560,280 H270"/>
  <text class="lab" x="410" y="272" fill="#1f6feb">→ D34 (reads this node)</text>
  <!-- button to GND -->
  <path class="w" stroke="#13203a" stroke-width="4" d="M560,280 V330"/>
  <rect x="536" y="330" width="48" height="40" rx="6" fill="#2b3442" stroke="#141a22"/>
  <circle cx="560" cy="350" r="11" fill="#c7ccd4"/>
  <text class="s" x="600" y="354" fill="#5a6b86">momentary button (N.O.)</text>
  <path class="w" stroke="#222831" stroke-width="5" d="M560,370 V410 H270 V380"/>
  <text class="s" x="330" y="432" fill="#5a6b86">GND</text>

  <!-- behavior of a press -->
  <text class="lab" x="70" y="200" fill="#5a6b86"></text>
  <text class="s" x="760" y="150" fill="#5a6b86"></text>
  <text class="th" x="640" y="200">Idle = <tspan fill="#2e8b57">HIGH (3.3 V)</tspan></text>
  <text class="th" x="640" y="222">Pressed = <tspan fill="#b23b3b">LOW (0 V)</tspan></text>

  <!-- behavior table -->
  <rect x="70" y="480" width="640" height="300" rx="10" fill="#ffffff" stroke="#b9c3d2" stroke-width="1.5"/>
  <text class="bt" x="90" y="514" font-size="16">What a button press does (by state)</text>
  <line x1="90" y1="528" x2="690" y2="528" stroke="#e1e7f0"/>
  <text class="th" x="90" y="560">State</text><text class="th" x="470" y="560">Press →</text>
  <g font-size="13.5" fill="#1c2a44">
    <text x="90" y="594">CALIBRATING / STOPPED / ERROR</text><text x="470" y="594" font-weight="800">(re)CALIBRATE</text>
    <text x="90" y="628">READY</text><text x="470" y="628" font-weight="800" fill="#2e8b57">START the run</text>
    <text x="90" y="662">RUNNING / RECOVERING</text><text x="470" y="662" font-weight="800" fill="#b23b3b">STOP</text>
  </g>
  <line x1="90" y1="684" x2="690" y2="684" stroke="#e1e7f0"/>
  <text class="note" x="90" y="712">So one button covers the whole flow: press to calibrate,</text>
  <text class="note" x="90" y="734">press to start, press to stop. Same as Serial c / s / x.</text>
  <text class="s" x="90" y="762">(40 ms debounce; the sketch already handles this in serviceButton().)</text>

  <!-- troubleshoot -->
  <rect x="730" y="300" width="380" height="480" rx="10" fill="#fff6e6" stroke="#c7891f" stroke-width="2"/>
  <text x="750" y="334" font-size="16" font-weight="800" fill="#8a5a00">If the button does nothing</text>
  <text class="note" x="750" y="364" fill="#5a3d00">D34 is <tspan font-weight="800">input-only, no internal pull-up</tspan>,</text>
  <text class="note" x="750" y="384" fill="#5a3d00">so the external 10 kΩ is <tspan font-weight="800">required</tspan>.</text>
  <text class="note" x="750" y="414" fill="#5a3d00"><tspan font-weight="800">Test with a meter, D34 → GND:</tspan></text>
  <text class="note" x="750" y="438" fill="#5a3d00">• Idle should read <tspan font-weight="800">~3.3 V</tspan></text>
  <text class="note" x="750" y="458" fill="#5a3d00">• Pressed should read <tspan font-weight="800">~0 V</tspan></text>
  <text class="note" x="750" y="486" fill="#5a3d00">If idle is <tspan font-weight="800">not 3.3 V</tspan> → the pull-up is</text>
  <text class="note" x="750" y="506" fill="#5a3d00">missing/miswired (that's the usual bug).</text>
  <text class="note" x="750" y="536" fill="#5a3d00">Check: 10 kΩ goes to <tspan font-weight="800">3V3</tspan> (not GND),</text>
  <text class="note" x="750" y="556" fill="#5a3d00">button goes to <tspan font-weight="800">GND</tspan>, both meet at the</text>
  <text class="note" x="750" y="576" fill="#5a3d00">D34 node. Use 2 <tspan font-weight="800">diagonal</tspan> legs of the</text>
  <text class="note" x="750" y="596" fill="#5a3d00">4-pin button.</text>
  <line x1="750" y1="620" x2="1090" y2="620" stroke="#e7d4a8"/>
  <text class="note" x="750" y="648" fill="#5a3d00"><tspan font-weight="800">Easier alternative:</tspan> move the button to</text>
  <text class="note" x="750" y="668" fill="#5a3d00">a normal pin that has an internal pull-up,</text>
  <text class="note" x="750" y="688" fill="#5a3d00">e.g. <tspan font-weight="800">D32</tspan>: set BUTTON_PIN=32 and use</text>
  <text class="note" x="750" y="708" fill="#5a3d00">pinMode(32, INPUT_PULLUP) — then you</text>
  <text class="note" x="750" y="728" fill="#5a3d00">need <tspan font-weight="800">no external resistor</tspan> (just button</text>
  <text class="note" x="750" y="748" fill="#5a3d00">to GND).</text>

  <text class="s" x="26" y="824">STBY uses a pull-DOWN (to GND); this button uses a pull-UP (to 3.3 V) — opposite, because the button should rest HIGH.</text>
</svg>
