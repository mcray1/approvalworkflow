<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1020" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg    { fill:#fbfcfe; }
    .title { fill:#13203a; font-size:25px; font-weight:700; }
    .sub   { fill:#4a5676; font-size:13px; }
    .bt    { fill:#ffffff; font-size:14px; font-weight:700; }
    .btd   { fill:#13203a; font-size:14px; font-weight:700; }
    .lab   { fill:#ffffff; font-size:10.5px; }
    .labd  { fill:#13203a; font-size:10.5px; }
    .note  { fill:#1f2a44; font-size:12.5px; }
    .noteb { fill:#13203a; font-size:13px; font-weight:700; }
    .wsig  { stroke:#1f6feb; stroke-width:3.2; fill:none; stroke-linecap:round; }
    .wmot  { stroke:#8a2be2; stroke-width:3.2; fill:none; stroke-linecap:round; }
    .wout  { stroke:#2e8b57; stroke-width:4;   fill:none; stroke-linecap:round; }
    .w3v3  { stroke:#e23b2e; stroke-width:3.2; fill:none; stroke-linecap:round; }
    .wvm   { stroke:#f08c00; stroke-width:4;   fill:none; stroke-linecap:round; }
    .wgnd  { stroke:#222831; stroke-width:3.6; fill:none; stroke-linecap:round; }
    .pad   { fill:#f6c453; stroke:#8a6d1b; stroke-width:1; }
  </style>

  <defs>
    <pattern id="holes" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#efe4c6"/>
      <circle cx="9" cy="9" r="2.3" fill="#b9ab82"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="1340" height="1020"/>
  <text class="title" x="30" y="44">ESP32 Line-Follower — Breadboard Layout</text>
  <text class="sub"   x="30" y="66">Physical placement. Wire colors: blue = sensor signal · purple = motor control · green = motor output · red = 3.3 V · orange = battery+/VM · black = GND. Pins match config.h.</text>

  <!-- ============ QTR-8RC SENSOR BAR (front of robot) ============ -->
  <rect x="150" y="90" width="620" height="66" rx="8" fill="#15314f" stroke="#0c2036" stroke-width="2"/>
  <text class="btd" x="150" y="84" dominant-baseline="auto">QTR-8RC reflectance array (robot front)</text>
  <!-- sensor eyes -->
  <g>
    <!-- 8 emitter/receiver pairs -->
    <g fill="#e9eef5">
      <circle cx="200" cy="112" r="6"/><circle cx="200" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="268" cy="112" r="6"/><circle cx="268" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="336" cy="112" r="6"/><circle cx="336" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="404" cy="112" r="6"/><circle cx="404" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="472" cy="112" r="6"/><circle cx="472" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="540" cy="112" r="6"/><circle cx="540" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="608" cy="112" r="6"/><circle cx="608" cy="134" r="4" fill="#9ab0c9"/>
      <circle cx="676" cy="112" r="6"/><circle cx="676" cy="134" r="4" fill="#9ab0c9"/>
    </g>
  </g>
  <!-- QTR header pins (bottom edge) -->
  <g>
    <!-- 8 OUT pins under each sensor -->
    <rect class="pad" x="196" y="156" width="8" height="8"/><rect class="pad" x="264" y="156" width="8" height="8"/>
    <rect class="pad" x="332" y="156" width="8" height="8"/><rect class="pad" x="400" y="156" width="8" height="8"/>
    <rect class="pad" x="468" y="156" width="8" height="8"/><rect class="pad" x="536" y="156" width="8" height="8"/>
    <rect class="pad" x="604" y="156" width="8" height="8"/><rect class="pad" x="672" y="156" width="8" height="8"/>
    <!-- power pins -->
    <rect class="pad" x="712" y="156" width="8" height="8"/><text class="lab" x="716" y="182" text-anchor="middle">VCC</text>
    <rect class="pad" x="738" y="156" width="8" height="8"/><text class="lab" x="742" y="182" text-anchor="middle" fill="#13203a">LEDON</text>
    <rect class="pad" x="760" y="156" width="8" height="8"/><text class="labd" x="764" y="196" text-anchor="middle">GND</text>
  </g>

  <!-- ============ LEGEND & NOTES PANEL ============ -->
  <rect x="830" y="80" width="480" height="350" rx="10" fill="#f4f7fb" stroke="#33415c" stroke-width="2"/>
  <rect x="830" y="80" width="480" height="30" rx="10" fill="#e8eefc" stroke="#33415c" stroke-width="2"/>
  <text class="btd" x="1070" y="101" text-anchor="middle">Legend &amp; assembly notes</text>
  <g>
    <line class="wsig" x1="850" y1="132" x2="892" y2="132"/><text class="note" x="900" y="136">Sensor signal → ESP32 GPIO</text>
    <line class="wmot" x1="850" y1="156" x2="892" y2="156"/><text class="note" x="900" y="160">Motor control → TB6612</text>
    <line class="wout" x1="850" y1="180" x2="892" y2="180"/><text class="note" x="900" y="184">Motor output → motor</text>
    <line class="w3v3" x1="850" y1="204" x2="892" y2="204"/><text class="note" x="900" y="208">3.3 V (red + rail)</text>
    <line class="wvm"  x1="850" y1="228" x2="892" y2="228"/><text class="note" x="900" y="232">Battery + / VM (motor supply)</text>
    <line class="wgnd" x1="850" y1="252" x2="892" y2="252"/><text class="note" x="900" y="256">GND (black − rail, common)</text>
  </g>
  <text class="noteb" x="850" y="286">Before power-up</text>
  <text class="note"  x="850" y="306">• Tie QTR LEDON and TB6612 STBY to the + (3V3) rail.</text>
  <text class="note"  x="850" y="324">• Power QTR &amp; TB6612 VCC from 3.3 V — never 5 V on ESP32 pins.</text>
  <text class="note"  x="850" y="342">• 10 kΩ from GPIO34 to + rail; button from GPIO34 node to − rail.</text>
  <text class="note"  x="850" y="360">• ⚠ GPIO12 (BIN1) is a strapping pin; if boot fails use GPIO33.</text>
  <text class="note"  x="850" y="378">• 12 V → TB6612 VM; 12 V→5 V buck → ESP32 VIN; ESP32 3V3 → + rail.</text>
  <text class="note"  x="850" y="396">• Verify motor direction (wheels up) &amp; steering sign in config.h.</text>
  <text class="note"  x="850" y="414">• Add a PHYSICAL kill switch on the motor supply.</text>

  <!-- ============ BREADBOARD ============ -->
  <rect x="250" y="360" width="600" height="380" rx="10" fill="#f6eecd" stroke="#cdbd8e" stroke-width="2"/>
  <!-- top rails -->
  <line x1="270" y1="378" x2="830" y2="378" stroke="#e23b2e" stroke-width="2"/>
  <text class="labd" x="258" y="382" text-anchor="end" fill="#e23b2e">+</text>
  <line x1="270" y1="394" x2="830" y2="394" stroke="#222831" stroke-width="2"/>
  <text class="labd" x="258" y="398" text-anchor="end">−</text>
  <!-- terminal fields -->
  <rect x="262" y="414" width="576" height="104" fill="url(#holes)" stroke="#d8c99b"/>
  <rect x="262" y="560" width="576" height="104" fill="url(#holes)" stroke="#d8c99b"/>
  <rect x="262" y="520" width="576" height="38" fill="#e7dcb6"/>
  <text class="sub" x="550" y="543" text-anchor="middle" fill="#9a8a5a">center channel</text>
  <!-- bottom rails -->
  <line x1="270" y1="682" x2="830" y2="682" stroke="#e23b2e" stroke-width="2"/>
  <text class="labd" x="258" y="686" text-anchor="end" fill="#e23b2e">+</text>
  <line x1="270" y1="698" x2="830" y2="698" stroke="#222831" stroke-width="2"/>
  <text class="labd" x="258" y="702" text-anchor="end">−</text>

  <!-- ============ ESP32 BOARD (straddles center channel) ============ -->
  <rect x="430" y="330" width="210" height="400" rx="8" fill="#1f2d3d" stroke="#0e1826" stroke-width="2"/>
  <rect x="505" y="316" width="60" height="18" rx="3" fill="#b8c0cc"/>  <!-- USB -->
  <text class="bt" x="535" y="356" text-anchor="middle">ESP32</text>
  <text class="lab" x="535" y="372" text-anchor="middle" fill="#9fb0c4">DevKit</text>

  <!-- left pads (sensors + power) -->
  <g>
    <circle class="pad" cx="438" cy="392" r="5"/><text class="lab" x="448" y="396">3V3</text>
    <circle class="pad" cx="438" cy="420" r="5"/><text class="lab" x="448" y="424">GND</text>
    <circle class="pad" cx="438" cy="456" r="5"/><text class="lab" x="448" y="460">G16</text>
    <circle class="pad" cx="438" cy="488" r="5"/><text class="lab" x="448" y="492">G17</text>
    <circle class="pad" cx="438" cy="520" r="5"/><text class="lab" x="448" y="524">G18</text>
    <circle class="pad" cx="438" cy="552" r="5"/><text class="lab" x="448" y="556">G19</text>
    <circle class="pad" cx="438" cy="584" r="5"/><text class="lab" x="448" y="588">G21</text>
    <circle class="pad" cx="438" cy="616" r="5"/><text class="lab" x="448" y="620">G22</text>
    <circle class="pad" cx="438" cy="648" r="5"/><text class="lab" x="448" y="652">G23</text>
    <circle class="pad" cx="438" cy="680" r="5"/><text class="lab" x="448" y="684">G4</text>
  </g>
  <!-- right pads (motors + button + power) -->
  <g>
    <circle class="pad" cx="632" cy="392" r="5"/><text class="lab" x="622" y="396" text-anchor="end">G25 PWMA</text>
    <circle class="pad" cx="632" cy="420" r="5"/><text class="lab" x="622" y="424" text-anchor="end">G26 AIN1</text>
    <circle class="pad" cx="632" cy="448" r="5"/><text class="lab" x="622" y="452" text-anchor="end">G27 AIN2</text>
    <circle class="pad" cx="632" cy="484" r="5"/><text class="lab" x="622" y="488" text-anchor="end">G14 PWMB</text>
    <circle class="pad" cx="632" cy="512" r="5"/><text class="lab" x="622" y="516" text-anchor="end">G12 BIN1</text>
    <circle class="pad" cx="632" cy="540" r="5"/><text class="lab" x="622" y="544" text-anchor="end">G13 BIN2</text>
    <circle class="pad" cx="632" cy="590" r="5"/><text class="lab" x="622" y="594" text-anchor="end">5V / VIN</text>
    <circle class="pad" cx="632" cy="640" r="5"/><text class="lab" x="622" y="644" text-anchor="end">G34 BTN</text>
    <circle class="pad" cx="632" cy="690" r="5"/><text class="lab" x="622" y="694" text-anchor="end">GND</text>
  </g>

  <!-- ============ TB6612FNG MODULE ============ -->
  <rect x="980" y="470" width="190" height="250" rx="8" fill="#2a6e3f" stroke="#184727" stroke-width="2"/>
  <text class="btd" x="1075" y="462" text-anchor="start">TB6612FNG driver</text>
  <!-- left header (control) -->
  <g>
    <circle class="pad" cx="980" cy="500" r="5"/><text class="lab" x="990" y="504">PWMA</text>
    <circle class="pad" cx="980" cy="528" r="5"/><text class="lab" x="990" y="532">AIN1</text>
    <circle class="pad" cx="980" cy="556" r="5"/><text class="lab" x="990" y="560">AIN2</text>
    <circle class="pad" cx="980" cy="592" r="5"/><text class="lab" x="990" y="596">PWMB</text>
    <circle class="pad" cx="980" cy="620" r="5"/><text class="lab" x="990" y="624">BIN1</text>
    <circle class="pad" cx="980" cy="648" r="5"/><text class="lab" x="990" y="652">BIN2</text>
  </g>
  <!-- top header (power) -->
  <g>
    <circle class="pad" cx="1010" cy="470" r="5"/><text class="lab" x="1010" y="486" text-anchor="middle">VM</text>
    <circle class="pad" cx="1060" cy="470" r="5"/><text class="lab" x="1060" y="486" text-anchor="middle">VCC</text>
    <circle class="pad" cx="1110" cy="470" r="5"/><text class="lab" x="1110" y="486" text-anchor="middle">STBY</text>
    <circle class="pad" cx="1150" cy="470" r="5"/><text class="lab" x="1150" y="486" text-anchor="middle">GND</text>
  </g>
  <!-- right header (motor outputs) -->
  <g>
    <circle class="pad" cx="1170" cy="520" r="5"/><text class="lab" x="1160" y="524" text-anchor="end">AO1</text>
    <circle class="pad" cx="1170" cy="548" r="5"/><text class="lab" x="1160" y="552" text-anchor="end">AO2</text>
    <circle class="pad" cx="1170" cy="620" r="5"/><text class="lab" x="1160" y="624" text-anchor="end">BO1</text>
    <circle class="pad" cx="1170" cy="648" r="5"/><text class="lab" x="1160" y="652" text-anchor="end">BO2</text>
  </g>

  <!-- ============ MOTORS ============ -->
  <g>
    <rect x="120" y="820" width="180" height="120" rx="16" fill="#cfd6de" stroke="#8a93a0" stroke-width="2"/>
    <rect x="120" y="820" width="46" height="120" rx="16" fill="#aeb7c2" stroke="#8a93a0" stroke-width="2"/>
    <text class="btd" x="210" y="886" text-anchor="middle">LEFT motor</text>
    <circle class="pad" cx="300" cy="856" r="5"/><text class="labd" x="308" y="860">AO1</text>
    <circle class="pad" cx="300" cy="900" r="5"/><text class="labd" x="308" y="904">AO2</text>
  </g>
  <g>
    <rect x="1040" y="820" width="180" height="120" rx="16" fill="#cfd6de" stroke="#8a93a0" stroke-width="2"/>
    <rect x="1174" y="820" width="46" height="120" rx="16" fill="#aeb7c2" stroke="#8a93a0" stroke-width="2"/>
    <text class="btd" x="1130" y="886" text-anchor="middle">RIGHT motor</text>
    <circle class="pad" cx="1040" cy="856" r="5"/><text class="labd" x="1032" y="860" text-anchor="end">BO1</text>
    <circle class="pad" cx="1040" cy="900" r="5"/><text class="labd" x="1032" y="904" text-anchor="end">BO2</text>
  </g>

  <!-- ============ BATTERY + REGULATOR ============ -->
  <rect x="470" y="828" width="200" height="120" rx="10" fill="#ffffff" stroke="#33415c" stroke-width="2"/>
  <text class="btd" x="570" y="878" text-anchor="middle">12 V battery</text>
  <text class="sub"  x="570" y="898" text-anchor="middle">≈ motor voltage</text>
  <circle class="pad" cx="670" cy="850" r="5"/><text class="labd" x="662" y="848" text-anchor="end">+</text>
  <circle class="pad" cx="470" cy="850" r="5"/><text class="labd" x="478" y="848">−</text>

  <rect x="700" y="846" width="150" height="70" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="2"/>
  <text class="btd" x="775" y="876" text-anchor="middle">Buck 12 V → 5 V</text>
  <text class="sub"  x="775" y="894" text-anchor="middle">DC-DC (e.g. LM2596)</text>

  <!-- =================== WIRES =================== -->
  <!-- Sensors: QTR OUT (y164) -> ESP32 left pads -->
  <g class="wsig">
    <path d="M200,164 C200,300 430,456 433,456"/>
    <path d="M268,164 C268,300 430,488 433,488"/>
    <path d="M336,164 C336,310 430,520 433,520"/>
    <path d="M404,164 C404,320 430,552 433,552"/>
    <path d="M472,164 C472,330 430,584 433,584"/>
    <path d="M540,164 C540,340 430,616 433,616"/>
    <path d="M608,164 C608,360 430,648 433,648"/>
    <path d="M676,164 C676,380 430,680 433,680"/>
  </g>

  <!-- QTR power: VCC & LEDON -> + rail ; GND -> - rail -->
  <path class="w3v3" d="M716,164 C716,300 835,378 830,378"/>
  <path class="w3v3" d="M742,164 C742,290 835,378 828,378"/>
  <path class="wgnd" d="M764,164 C764,300 835,394 830,394"/>

  <!-- ESP32 power: 3V3 -> + rail, GND -> - rail -->
  <path class="w3v3" d="M433,392 C360,392 300,378 270,378"/>
  <path class="wgnd" d="M433,420 C360,420 300,394 270,394"/>
  <path class="wgnd" d="M637,690 C720,690 760,698 830,698"/>

  <!-- Motor control: ESP32 right -> TB6612 left -->
  <g class="wmot">
    <path d="M637,392 C800,392 900,500 975,500"/>
    <path d="M637,420 C800,430 900,528 975,528"/>
    <path d="M637,448 C800,470 900,556 975,556"/>
    <path d="M637,484 C800,520 900,592 975,592"/>
    <path d="M637,512 C800,560 900,620 975,620"/>
    <path d="M637,540 C800,600 900,648 975,648"/>
  </g>

  <!-- TB6612 power: VCC & STBY -> bottom + rail ; GND -> bottom - rail (routed
       low so they do not cross the legend panel). VM -> battery+ below. -->
  <path class="w3v3" d="M1060,470 C980,432 820,540 815,682"/>
  <path class="w3v3" d="M1110,470 C1010,432 800,560 800,682"/>
  <path class="wgnd" d="M1150,470 C1040,432 785,580 785,698"/>

  <!-- TB6612 motor outputs -> motors (AO1/AO2 -> LEFT, BO1/BO2 -> RIGHT) -->
  <path class="wout" d="M1175,520 C1255,560 360,740 305,856"/>
  <path class="wout" d="M1175,548 C1255,610 380,790 305,900"/>
  <path class="wout" d="M1175,620 C1240,710 1120,800 1045,856"/>
  <path class="wout" d="M1175,648 C1240,730 1140,820 1045,900"/>

  <!-- Battery + (12 V) -> TB6612 VM (orange), and -> buck input -->
  <path class="wvm"  d="M675,850 C820,820 1010,560 1010,476"/>
  <path class="wvm"  d="M675,850 C690,858 700,870 700,881"/>
  <!-- Buck 5 V out -> ESP32 5V/VIN pad (orange). ESP32 3V3-out feeds the + rail. -->
  <path class="wvm"  d="M775,846 C765,720 690,620 637,590"/>
  <text class="labd" x="690" y="640">5 V</text>
  <!-- Battery - -> - rail (common) -->
  <path class="wgnd" d="M465,850 C360,850 300,700 285,698"/>

  <!-- ============ BUTTON on breadboard (right of ESP32) ============ -->
  <rect x="690" y="600" width="44" height="44" rx="5" fill="#2b3442" stroke="#141a22" stroke-width="2"/>
  <circle cx="712" cy="622" r="12" fill="#c7ccd4" stroke="#8a93a0"/>
  <text class="labd" x="712" y="664" text-anchor="middle">Start/Stop</text>
  <!-- node to G34 (blue) -->
  <circle cx="690" cy="622" r="4" fill="#13203a"/>
  <path class="wsig" d="M690,622 C660,622 650,640 637,640"/>
  <!-- 10k pull-up from node to + rail (red), drawn as zigzag then wire -->
  <polyline class="w3v3" points="690,622 676,610 696,602 676,594 696,586 684,580"/>
  <path class="w3v3" d="M684,580 C684,480 760,378 830,378"/>
  <text class="labd" x="700" y="576">10kΩ</text>
  <!-- other button leg to - rail (black) -->
  <path class="wgnd" d="M734,622 C780,622 800,698 830,698"/>

  <text class="sub" x="30" y="1006">Full pin table: WIRING.md · schematic view: docs/wiring_diagram.svg · pins defined in config.h.</text>
</svg>
